name: generate-builds
on:
  push:

jobs:
  generate-2ship-otr:
    runs-on: ubuntu-24.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Init submodules
      run: git submodule update --init --force
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.20
      with:
        key: ${{ runner.os }}-otr
        restore-keys: |
          ${{ runner.os }}-otr
        append-timestamp: true
        verbose: 2
        max-size: "500M"
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool
    - name: Generate 2ship.o2r
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        export CCACHE_LOGFILE=${{ github.workspace }}/ccache.log
        ccache --zero-stats
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-cmake --config Release --target Generate2ShipOtr --parallel 10
        ccache --show-stats
        echo "=== ccache log (last 50 lines) ==="
        tail -50 ccache.log || true
    - name: Upload 2ship.o2r
      uses: actions/upload-artifact@v4
      with:
        name: 2ship.o2r
        path: 2ship.o2r
        retention-days: 3

  build-switch:
    runs-on: ${{ (vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER)) || 'ubuntu-latest' }}
    container:
      image: devkitpro/devkita64:latest
    env:
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros,pch_defines,system_headers
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 1
    steps:
    - uses: actions/checkout@v6
    - name: Fix dubious ownership (container)
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Init submodules
      run: git submodule update --init --force --recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
        sudo apt-get remove -y cmake
        sudo dkp-pacman -R --noconfirm switch-tinyxml2
        wget https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.sh -O /tmp/cmake.sh
        sudo sh /tmp/cmake.sh --prefix=/usr/local/ --exclude-subdir

    - name: ccache (minimal key, max hits)
      uses: hendrikmuhs/ccache-action@v1.2.20
      with:
        key: ${{ runner.os }}
        restore-keys: |
          ${{ runner.os }}
        append-timestamp: true
        verbose: 2
        max-size: "1G"

    - name: Build 2ship
      env:
        CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
      run: |
        ccache --zero-stats
        cmake -H. -Bbuild-switch -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
        cmake --build build-switch --target 2ship_nro --config Release --parallel 10
        ccache --show-stats
        echo "=== ccache log (last 50 lines) ==="
        tail -50 ccache.log || true
        wget -O gamecontrollerdb.txt https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt

        mv build-switch/mm/*.nro 2ship.nro
        mv README.md readme.txt

    - name: Upload NRO and supporting files
      uses: actions/upload-artifact@v4
      with:
        name: 2ship-switch-nro[${{ github.sha }}].zip
        path: |
          2ship.nro
          readme.txt
          gamecontrollerdb.txt
        retention-days: 3

  combine-artifacts:
    needs: [generate-2ship-otr, build-switch]
    runs-on: ubuntu-latest
    steps:
    - name: Download OTR artifact
      uses: actions/download-artifact@v4
      with:
        name: 2ship.o2r
        path: ./artifacts

    - name: Download Switch NRO artifact
      uses: actions/download-artifact@v4
      with:
        name: 2ship-switch-nro[${{ github.sha }}].zip
        path: ./artifacts

    - name: Upload combined build
      uses: actions/upload-artifact@v4
      with:
        name: 2ship-switch[${{ github.sha }}].zip
        path: ./artifacts
        retention-days: 3
